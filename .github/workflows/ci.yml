name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Postgres for the persistent request log tests (tests/test_store.py); SQLite runs everywhere else.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci-only@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: "Install (light: the same install Streamlit Cloud uses, plus test tools)"
        run: pip install -r requirements.txt "pytest~=9.1" "pytest-cov~=7.1" "ruff==0.16.10" "pip-audit~=2.10"
      - name: Lint and format check
        run: |
          ruff check .
          ruff format --check .
      - name: Dependency audit (fails on any known vulnerability)
        run: pip-audit -r requirements.txt --progress-spinner off
      - name: Policy copy matches the pinned Project 1 commit
        run: python scripts/sync_policy.py --check
      - name: Unit tests with coverage (gate 90%)
        run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=90
      - name: "Eval gates on the recorded final run: escalation, injection and no-promise at 100% (no API)"
        run: python -m eval.run_eval --replay eval/recorded/main-final.jsonl --gate --no-report
      - name: "Held-out set, recorded run: same gates (no API)"
        run: python -m eval.run_eval --replay eval/recorded/heldout-final.jsonl --gate --no-report

  harness-gates:
    name: "Eval harness gates (hoteleval v1.0.0, recorded mode, no API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the eval harness at its release tag (standard library only)
        run: pip install "hoteleval @ git+https://github.com/vamsialladev/eval-harness@v1.0.0"
      - name: "Gate the recorded final and held-out runs against the harness baseline (no API)"
        run: hoteleval gate --project guest-request-agent --recorded eval/recorded/main-final.jsonl eval/recorded/heldout-final.jsonl

  release-gate:
    name: "Release run v1.1.0 gated with latency and cost budgets (hoteleval v1.2.0, saved live run, no API)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install the eval harness at its release tag (standard library only)
        run: pip install "hoteleval @ git+https://github.com/vamsialladev/eval-harness@v1.2.0"
      - name: "Gate the saved live run of this release: hard gates, floors, stable flips, p95 and cost budgets"
        run: hoteleval gate --run-file eval/harness/p2-v1.1.0-2026-10-15.jsonl

  links:
    name: Link check (lychee)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Link check (README and docs; fails on broken links)
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --retry-wait-time 5 --timeout 30
            --accept "200..=299,303,403,429,503,999"
            --exclude "^https://(www\.)?linkedin\.com" --exclude "^https?://localhost" --exclude "^http://127\.0\.0\.1"
            README.md SECURITY.md CONTRIBUTING.md CHANGELOG.md 'docs/**/*.md'
          fail: true

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (full history)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose --exit-code 1 .
